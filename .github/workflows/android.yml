name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/Nabra-${GITHUB_SHA::7}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk out/Nabra.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nabra-debug-apk
          path: out/Nabra-*.apk
          retention-days: 30

      # Direct phone-friendly download: always-updated "latest" release with Nabra.apk
      - name: Publish latest APK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "نبرة — آخر نسخة"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: true
          overwrite_files: true
          body: |
            آخر نسخة من نبرة (debug APK) — من الكوميت ${{ github.sha }}.
            نزّل **Nabra.apk** وثبّته على موبايلك.
          files: out/Nabra.apk

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          if-no-files-found: ignore
